name: Build and Push to Azure ACR

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: neuraworkacr.azurecr.io
  IMAGE_NAME: open-webui

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The v0.11.0 frontend no longer fits in Node's default ~4 GB heap:
      # `vite build` dies with "Ineffective mark-compacts near heap limit".
      # Upstream ships the ENV line commented out in the Dockerfile and injects
      # it from CI instead (see .github/workflows/docker.yaml.disabled) — we do
      # the same, so Dockerfile stays byte-identical to upstream and never
      # conflicts on a merge. Built from RUNNER_TEMP, the repo copy is untouched.
      - name: Prepare CI Dockerfile (raise Node heap limit)
        run: |
          awk '
            /^FROM --platform=\$BUILDPLATFORM node:/ {
              print
              print "ENV NODE_OPTIONS=\"--max-old-space-size=12288\""
              next
            }
            { print }
          ' Dockerfile > "${RUNNER_TEMP}/Dockerfile"
          grep -n "NODE_OPTIONS" "${RUNNER_TEMP}/Dockerfile" || {
            echo "::error::NODE_OPTIONS injection failed — the node build stage line changed upstream"
            exit 1
          }

      - name: Log in to Azure Container Registry
        if: github.event_name != 'pull_request'
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Unique tags per build (immutable)
            type=sha,prefix=git-,format=short
            type=raw,value=build-${{ github.run_number }}-{{date 'YYYYMMDD-HHmmss'}}
            # Only update 'latest' on main branch
            type=raw,value=latest,enable={{is_default_branch}}
            # Semver tags if git tags exist
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ runner.temp }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          build-args: |
            BUILD_HASH=${{ github.sha }}
            USE_SLIM=true

      - name: Output Image Summary
        if: github.event_name != 'pull_request'
        run: |
          echo "## 🐳 Docker Image Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** \`${{ env.REGISTRY }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Image Tags" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Quick Pull Command" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:git-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
